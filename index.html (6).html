<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Printers — Packaging Manufacturing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#071527;
    --navy-900:#0B1E36;
    --navy-800:#122A4A;
    --orange-500:#E15B23;
    --orange-600:#C74A18;
    --paper-050:#F5F6F4;
    --paper-100:#E7E9E6;
    --ink-muted:#B9C2CC;
    --header-h:88px;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:var(--paper-050);
    color:var(--navy-900);
  }

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; }

  /* ---------- HEADER ---------- */
  .site-header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:40;
    height:var(--header-h);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 clamp(20px, 5vw, 64px);
    background:linear-gradient(to bottom, rgba(7,21,39,0.65) 0%, rgba(7,21,39,0.0) 100%);
    opacity:0;
    transition:background 0.35s ease, box-shadow 0.35s ease, height 0.3s ease;
    animation:headerIn 0.7s ease-out 0.15s forwards;
  }
  .site-header.scrolled{
    background:rgba(7,21,39,0.94);
    box-shadow:0 8px 24px -12px rgba(0,0,0,0.5);
    backdrop-filter:blur(6px);
  }
  @keyframes headerIn{
    from{ opacity:0; transform:translateY(-8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .logo{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.3px;
    color:#fff;
  }
  .logo span.mark{ color:var(--orange-500); }
  /* Replace this text logo with the client's real logo image, e.g.:
     <img src="ip-printers-logo.png" alt="IP Printers" style="height:40px;">
  */

  .main-nav{ display:flex; align-items:center; gap:40px; }
  .main-nav ul{
    list-style:none;
    display:flex;
    gap:36px;
    margin:0; padding:0;
  }
  .main-nav a{
    color:#EDEFEF;
    font-size:15px;
    font-weight:500;
    position:relative;
    padding:6px 0;
    transition:color 0.25s ease;
  }
  .main-nav a::after{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:0;
    height:2px;
    background:var(--orange-500);
    transition:width 0.25s ease;
  }
  .main-nav a:hover{ color:#fff; }
  .main-nav a:hover::after{ width:100%; }
  .main-nav a:focus-visible{ outline:2px solid var(--orange-500); outline-offset:4px; }

  .nav-toggle{
    display:none;
    background:none;
    border:none;
    cursor:pointer;
    padding:8px;
    width:44px; height:44px;
    align-items:center;
    justify-content:center;
  }
  .nav-toggle span,
  .nav-toggle::before,
  .nav-toggle::after{
    content:"";
    display:block;
    width:24px;
    height:2px;
    background:#fff;
    transition:transform 0.3s ease, opacity 0.3s ease;
  }
  .nav-toggle span{ margin:6px 0; }
  .nav-toggle[aria-expanded="true"]::before{ transform:translateY(8px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span{ opacity:0; }
  .nav-toggle[aria-expanded="true"]::after{ transform:translateY(-8px) rotate(-45deg); }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    min-height:100dvh; /* actual visible height on mobile browsers, avoids address-bar jump */
    width:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
  }

  @keyframes heroBgIn{
    from{ transform:scale(1.1) translate3d(0,0,0); opacity:0.8; }

  .hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(100deg,
      rgba(7,21,39,0.92) 0%,
      rgba(7,21,39,0.80) 32%,
      rgba(7,21,39,0.45) 58%,
      rgba(7,21,39,0.25) 100%);
  }
  .hero-overlay-bottom{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(5,14,26,0.55) 0%, transparent 30%);
  }

  .hero-content{
    position:relative;
    z-index:10;
    width:100%;
    max-width:1280px;
    margin:0 auto;
    padding:0 clamp(20px, 5vw, 64px);
    padding-top:var(--header-h);
  }

  .hero-copy{ max-width:640px; width:100%; }

  .accent-line{
    display:block;
    width:56px;
    height:3px;
    background:var(--orange-500);
    border-radius:2px;
    margin-bottom:24px;
    transform:scaleX(0);
    transform-origin:left center;
    animation:drawLine 0.6s cubic-bezier(0.65,0,0.35,1) 0.2s forwards;
  }
  @keyframes drawLine{
    to{ transform:scaleX(1); }
  }

  .hero-copy h1{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:clamp(2.25rem, 4.6vw, 4rem);
    line-height:1.05;
    letter-spacing:-0.5px;
    color:#FFFFFF;
    margin:0 0 22px 0;
  }
  .hero-copy h1 .line-mask{
    display:block;
    overflow:hidden;
  }
  .hero-copy h1 .line-inner{
    display:block;
    transform:translateY(110%);
    animation:lineUp 0.85s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .hero-copy h1 .line-mask:nth-child(1) .line-inner{ animation-delay:0.38s; }
  .hero-copy h1 .line-mask:nth-child(2) .line-inner{ animation-delay:0.5s; }
  @keyframes lineUp{
    to{ transform:translateY(0); }
  }

  .hero-copy p{
    font-size:clamp(1rem, 1.4vw, 1.15rem);
    line-height:1.6;
    color:var(--ink-muted);
    max-width:520px;
    margin:0 0 40px 0;
    opacity:0;
    transform:translateY(16px);
    animation:riseIn 0.8s ease-out 0.75s forwards;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .hero-ctas{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 28px;
    font-size:15px;
    font-weight:600;
    border-radius:6px;
    border:1.5px solid transparent;
    cursor:pointer;
    transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    opacity:0;
    transform:translateY(14px);
    will-change:transform;
  }
  .cta:nth-child(1){ animation:riseIn 0.6s ease-out 0.95s forwards; }
  .cta:nth-child(2){ animation:riseIn 0.6s ease-out 1.07s forwards; }
  .cta:nth-child(3){ animation:riseIn 0.6s ease-out 1.19s forwards; }

  .cta:focus-visible{ outline:2px solid #fff; outline-offset:3px; }

  .cta-primary{
    position:relative;
    background:var(--orange-500);
    color:#fff;
    overflow:hidden;
    isolation:isolate;
  }
  .cta-primary::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
    transform:translateX(-120%);
    transition:transform 0.6s ease;
    z-index:-1;
  }
  .cta-primary:hover::before{ transform:translateX(120%); }
  .cta-primary:hover{
    background:var(--orange-600);
    transform:translateY(-3px);
    box-shadow:0 12px 24px -8px rgba(225,91,35,0.55);
  }
  .cta-primary .arrow{ transition:transform 0.25s ease; }
  .cta-primary:hover .arrow{ transform:translateX(4px); }

  .cta-secondary{
    background:rgba(255,255,255,0.06);
    color:#fff;
    border-color:rgba(255,255,255,0.35);
    backdrop-filter:blur(2px);
  }
  .cta-secondary:hover{
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.6);
    transform:translateY(-3px);
    box-shadow:0 10px 20px -10px rgba(0,0,0,0.5);
  }
  .cta-secondary:hover svg{ transform:scale(1.12); }
  .cta-secondary svg{ transition:transform 0.25s ease; }

  .cta-whatsapp{ }
  .cta-call{ }

  /* icons */
  .icon{ width:18px; height:18px; flex-shrink:0; }

  /* scroll cue */
  .scroll-cue{
    position:absolute;
    left:clamp(20px, 5vw, 64px);
    bottom:32px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink-muted);
    font-size:12px;
    letter-spacing:0.5px;
    opacity:0;
    animation:fadeInOnly 0.8s ease-out 1.4s forwards;
  }
  @keyframes fadeInOnly{ to{ opacity:0.85; } }
  .scroll-cue .line{
    position:relative;
    width:1px; height:36px;
    overflow:hidden;
    background:rgba(255,255,255,0.15);
  }
  .scroll-cue .line::after{
    content:"";
    position:absolute;
    left:0; top:-100%;
    width:100%; height:100%;
    background:linear-gradient(to bottom, transparent, var(--orange-500));
    animation:cueDrift 1.8s ease-in-out 1.6s infinite;
  }
  @keyframes cueDrift{
    0%{ top:-100%; }
    60%{ top:100%; }
    100%{ top:100%; }
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px){
    .main-nav ul{ 
      position:fixed;
      top:0; right:0;
      height:100vh;
      width:min(78vw, 320px);
      background:var(--navy-950);
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      gap:28px;
      padding:0 40px;
      transform:translateX(100%);
      transition:transform 0.35s ease;
      z-index:50;
    }
    .main-nav ul.open{ transform:translateX(0); }
    .main-nav a{ font-size:18px; }
    .nav-toggle{ display:flex; z-index:60; }
  }

  @media (max-width: 600px){
    :root{ --header-h:64px; }

    .site-header{ padding:0 20px; }
    .logo{ font-size:18px; }

    .hero{ align-items:flex-end; }
    .hero-bg{ background-position: center, 30% center; }
    .hero-overlay{
      background:linear-gradient(180deg,
        rgba(7,21,39,0.55) 0%,
        rgba(7,21,39,0.75) 45%,
        rgba(5,14,26,0.95) 100%);
    }
    .hero-content{
      padding-top:calc(var(--header-h) + 16px);
      padding-bottom:36px;
    }
    .hero-copy{ max-width:100%; }
    .hero-copy h1{
      font-size:clamp(1.85rem, 8vw, 2.4rem);
      margin-bottom:16px;
    }
    .hero-copy p{
      font-size:0.95rem;
      max-width:100%;
      margin-bottom:28px;
    }
    .hero-ctas{ flex-direction:column; align-items:stretch; gap:12px; }
    .cta{
      justify-content:center;
      padding:16px 22px;
      min-height:52px; /* comfortable tap target */
      font-size:15px;
    }
    .cta-primary{ order:1; }
    .cta-whatsapp{ order:2; }
    .cta-call{ order:3; }
    .scroll-cue{ display:none; }
  }

  @media (max-width: 380px){
    .logo{ font-size:16px; }
    .hero-copy h1{ font-size:1.7rem; }
  }

  /* Landscape phones: hero can be shorter than 100dvh comfortably */
  @media (max-width: 900px) and (orientation:landscape){
    .hero{ min-height:auto; padding:calc(var(--header-h) + 24px) 0 40px; }
  }
</style>
</head>
<body>

<header class="site-header">

  <nav class="main-nav" aria-label="Primary">

    </ul>
  </nav>

  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-menu">

</header>

<section class="hero" id="home">
  <div class="hero-bg"></div>

  <div class="hero-content">
    <div class="hero-copy">

        <span class="line-mask"><span class="line-inner">Your Packaging.</span></span>

          </span>

        <a href="https://wa.me/923056232108?text=Hi%20IP%20Printers%2C%20I%E2%80%99d%20like%20to%20discuss%20a%20packaging%20order%20for%20my%20business." class="cta cta-secondary cta-whatsapp" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.29-.15-1.7-.84-1.96-.93-.26-.1-.46-.15-.65.15-.2.29-.75.93-.92 1.12-.17.2-.34.22-.63.08-.29-.15-1.22-.45-2.33-1.44-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.2-.29.29-.48.1-.2.05-.37-.02-.51-.08-.15-.65-1.57-.9-2.15-.24-.57-.48-.5-.65-.5-.17-.01-.36-.01-.56-.01s-.51.08-.78.37c-.26.29-1.02 1-1.02 2.43 0 1.43 1.04 2.81 1.19 3 .15.2 2.05 3.13 4.96 4.39.69.3 1.23.48 1.65.61.69.22 1.32.19 1.82.11.55-.08 1.7-.7 1.94-1.37.24-.68.24-1.26.17-1.38-.07-.12-.26-.2-.55-.34z"/><path d="M12 2a10 10 0 0 0-8.61 15.02L2 22l5.13-1.35A10 10 0 1 0 12 2zm0 18.2a8.18 8.18 0 0 1-4.17-1.14l-.3-.18-3.05.8.81-2.97-.2-.31A8.2 8.2 0 1 1 12 20.2z"/></svg>

  <div class="scroll-cue" aria-hidden="true">

  </div>

<script>
  const toggle = document.getElementById('navToggle');
  const menu = document.getElementById('primary-menu');
  toggle.addEventListener('click', () => {
    const isOpen = menu.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(isOpen));
  });
  menu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      menu.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });

  // Header solidifies on scroll
  const header = document.querySelector('.site-header');
  const onScroll = () => {
    header.classList.toggle('scrolled', window.scrollY > 24);
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();

  // Subtle background parallax on pointer move (desktop with fine pointer only)
  const heroBg = document.querySelector('.hero-bg');
  const heroSection = document.querySelector('.hero');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if (heroBg && heroSection && !prefersReducedMotion && hasFinePointer) {
    let raf = null;
    heroSection.addEventListener('mousemove', (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const rect = heroSection.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width - 0.5;  // -0.5..0.5
        const py = (e.clientY - rect.top) / rect.height - 0.5;
        const maxShift = 10; // px, kept subtle
        heroBg.style.setProperty('--mx', `${(-px * maxShift).toFixed(1)}px`);
        heroBg.style.setProperty('--my', `${(-py * maxShift).toFixed(1)}px`);
        raf = null;
      });
    });
    heroSection.addEventListener('mouseleave', () => {
      heroBg.style.setProperty('--mx', '0px');
      heroBg.style.setProperty('--my', '0px');
    });
  }
</script>

</body>
